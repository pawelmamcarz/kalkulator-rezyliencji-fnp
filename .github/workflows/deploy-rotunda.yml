name: Deploy Rotunda

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/deploy-rotunda.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-rotunda-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy Rotunda Worker
        run: npx --no-install wrangler deploy -c demo/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
